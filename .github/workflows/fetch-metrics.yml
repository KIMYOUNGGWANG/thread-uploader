name: Fetch Post Metrics

on:
  schedule:
    # 매일 KST 21:00 (UTC 12:00) — 하루 게시가 마무리된 후 수집
    - cron: '0 12 * * *'
  workflow_dispatch: # 수동 실행 가능

jobs:
  fetch-metrics:
    runs-on: ubuntu-latest
    steps:
      # Metrics then learning, both through the app routes (single score formula in src/lib/growth-learning.ts)
      - name: Collect metrics and refresh growth learning
        env:
          APP_URL: ${{ vars.APP_URL || 'https://thread-uploader.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          for path in fetch-metrics learn; do
            echo "::group::$path"
            curl --fail-with-body --show-error --silent --location --max-time 90 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${APP_URL%/}/api/cron/${path}"
            echo
            echo "::endgroup::"
          done
