name: Account Intelligence

on:
  # 일시 중지 (2026-10-22): 11/17 글 길이 실험 판정 전까지 발행·채우기·지표 수집 외 자동화는 동결. 다시 켜려면 아래 schedule 주석 해제. workflow_dispatch 수동 실행은 그대로 가능.
  # schedule:
  #   - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  account-intelligence:
    runs-on: ubuntu-latest
    steps:
      - name: Run account intelligence cron
        env:
          APP_URL: ${{ vars.APP_URL || 'https://thread-uploader.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL"
          curl --fail-with-body --show-error --silent --location \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/account-intelligence"
