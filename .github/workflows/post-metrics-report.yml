name: Post Metrics Report

# 수동 실행 전용 — 최근 발행 글의 조회수·반응을 읽는다. 저장소가 공개라 실행 로그도 공개이므로,
# 보고서는 입력으로 받은 RSA 공개키로 암호화한 뒤에만 찍는다(평문은 로그에 남지 않는다).
# 복호화: KEY 줄을 base64 -d | openssl pkeyutl -decrypt -inkey private.pem -pkeyopt rsa_padding_mode:oaep
#        DATA 줄을 base64 -d | openssl enc -d -aes-256-cbc -pbkdf2 -pass file:<복호화한 키>
on:
  workflow_dispatch:
    inputs:
      public_key_b64:
        description: 'base64로 인코딩한 RSA 공개키 PEM (필수)'
        required: true
      days:
        description: '최근 며칠 (1-60)'
        default: '14'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and encrypt the report
        env:
          APP_URL: ${{ vars.APP_URL || 'https://thread-uploader.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PUBKEY_B64: ${{ inputs.public_key_b64 }}
          DAYS: ${{ inputs.days }}
        run: |
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          [[ "$DAYS" =~ ^[0-9]{1,2}$ ]] || { echo "invalid days: $DAYS"; exit 1; }
          [[ "$PUBKEY_B64" =~ ^[A-Za-z0-9+/=]+$ ]] || { echo "public_key_b64 must be base64"; exit 1; }
          umask 077
          printf '%s' "$PUBKEY_B64" | base64 -d > pub.pem
          openssl pkey -pubin -in pub.pem -noout || { echo "not a public key"; exit 1; }
          {
            for slug in cosmicpath cosmicpath-global; do
              curl --fail --show-error --silent --location --max-time 120 \
                -H "Authorization: Bearer ${CRON_SECRET}" \
                "${APP_URL%/}/api/cron/post-metrics-report?brand=${slug}&days=${DAYS}"
              echo
            done
          } > report.jsonl
          openssl rand -hex 32 > aes.key
          echo "KEY:$(openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in aes.key | base64 -w0)"
          echo "DATA:$(openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:aes.key -in report.jsonl | base64 -w0)"
          rm -f report.jsonl aes.key
