name: Viral Discovery

on:
  # 일시 중지 (2026-10-31): 궁합 유입 기여 없음. 11/17 글 길이 실험 판정 전까지 발행·채우기·지표 수집 외 자동화 동결. 다시 켜려면 아래 schedule 주석 해제. workflow_dispatch 수동 실행은 그대로 가능.
  # schedule:
  #   # 4시간마다. ref_replay 원본 자격(두 번 잡힘 + 3h)이 하루 안에 차도록. Claude 분석은 0·12시 실행만
  #   - cron: '41 0,12 * * *'     # KST 09:41, 21:41 (분석 포함)
  #   - cron: '41 4,8,16,20 * * *' # KST 13:41, 17:41, 01:41, 05:41 (분석 생략)
  workflow_dispatch: # 수동 실행 가능

concurrency:
  group: viral
  cancel-in-progress: false

jobs:
  viral:
    runs-on: ubuntu-latest
    steps:
      - name: Discover and learn viral patterns
        env:
          APP_URL: ${{ vars.APP_URL || 'https://thread-uploader.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          ANALYZE=true; [ "${{ github.event.schedule }}" = "41 4,8,16,20 * * *" ] && ANALYZE=false
          curl --fail-with-body --show-error --silent --location --max-time 300 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/viral?analyze=${ANALYZE}"
          echo
