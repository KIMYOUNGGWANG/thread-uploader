name: Viral Discovery

on:
  schedule:
    - cron: '41 0,12 * * *'   # 하루 2회(KST 09:41, 21:41). 글 반응은 첫 48시간에 붙으므로 매시간은 낭비
  workflow_dispatch: # 수동 실행 가능

concurrency:
  group: viral
  cancel-in-progress: false

jobs:
  viral:
    runs-on: ubuntu-latest
    steps:
      - name: Discover and learn viral patterns
        env:
          APP_URL: ${{ vars.APP_URL || 'https://thread-uploader.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --show-error --silent --location --max-time 300 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/viral"
          echo
