name: Trend Radar

on:
  # 일시 중지 (2026-10-22): 11/17 글 길이 실험 판정 전까지 발행·채우기·지표 수집 외 자동화는 동결. 다시 켜려면 아래 schedule 주석 해제. workflow_dispatch 수동 실행은 그대로 가능.
  # schedule:
  #   # 하루 1회 KST 06:29 — 최근 72시간 커뮤니티 갈등을 웹 검색으로 수집해 사주 훅으로 변환 (첫 발행 슬롯 전)
  #   - cron: '29 21 * * *'
  workflow_dispatch:

concurrency:
  group: trends
  cancel-in-progress: false

jobs:
  trends:
    runs-on: ubuntu-latest
    steps:
      - name: Harvest and transpose trends
        env:
          APP_URL: ${{ vars.APP_URL || 'https://thread-uploader.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TREND_BRAND_SLUGS: ${{ vars.TREND_BRAND_SLUGS || 'cosmicpath' }}
        run: |
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --show-error --silent --location --max-time 300 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/trends?brands=${TREND_BRAND_SLUGS}"
          echo
