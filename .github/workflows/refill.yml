name: Queue Refill

on:
  schedule:
    # 하루 1회 KST 07:13 — 트렌드 레이더(06:29) 직후, 대기열이 목표치 아래면 자동 생성
    - cron: '13 22 * * *'
    # 길이 실험(2026-10-16 사전 등록)용 추가 실행 — 실험 종료 후 제거 (KST 15:13, 23:13)
    - cron: '13 6 * * *'
    - cron: '13 14 * * *'
  workflow_dispatch:

concurrency:
  group: refill
  cancel-in-progress: false

jobs:
  refill:
    runs-on: ubuntu-latest
    steps:
      - name: Refill post queues
        env:
          APP_URL: ${{ vars.APP_URL || 'https://thread-uploader.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          status=0
          # slug:target — target is ~2 days of publish slots (KR 5/day, global 2/day)
          for entry in cosmicpath:10 cosmicpath-global:4; do
            slug="${entry%%:*}"; target="${entry##*:}"
            echo "::group::$slug"
            curl --fail-with-body --show-error --silent --location --max-time 300 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${APP_URL%/}/api/cron/refill?brand=${slug}&target=${target}" || status=1
            echo
            echo "::endgroup::"
          done
          exit $status
