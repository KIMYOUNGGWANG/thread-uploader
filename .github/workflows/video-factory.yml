name: Video Factory

on:
  schedule:
    # KST 06:00 — 오늘의 kinetic-list 영상 1편 렌더
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '오늘 이미 만든 영상이 있어도 1편 더 만든다 (하루 최대 3편)'
        type: boolean
        default: false

concurrency:
  group: video-factory
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: video/pnpm-lock.yaml

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install runner dependencies
        working-directory: video
        run: pnpm install --frozen-lockfile

      - name: Render, check, upload, and report
        env:
          APP_URL: ${{ secrets.APP_URL || vars.APP_URL || 'https://thread-uploader.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          VIDEO_FACTORY_BRANDS: cosmicpath
          VIDEO_FACTORY_FORCE: ${{ inputs.force && '1' || '' }}
        run: node video/scripts/factory-job.mjs
