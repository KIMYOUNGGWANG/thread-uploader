name: Shorts Radar

on:
  # 수집 중지 (2026-10-31): 궁합 유입 기여 없음. 다시 켜려면 discover cron 주석 해제.
  # snapshot은 7일 지난 쇼츠 삭제(YouTube 캐싱 약관)를 맡아서 하루 1회로 남김.
  schedule:
    # - cron: '7 */6 * * *'
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 실행할 작업
        type: choice
        options: [discover, snapshot]
        default: snapshot

concurrency:
  group: shorts
  cancel-in-progress: false

jobs:
  discover:
    if: github.event.schedule == '7 */6 * * *' || github.event.inputs.mode == 'discover'
    runs-on: ubuntu-latest
    steps:
      - name: Discover rising Shorts
        env:
          APP_URL: ${{ vars.APP_URL || 'https://thread-uploader.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SHORTS_BRAND_SLUGS: ${{ vars.SHORTS_BRAND_SLUGS || 'cosmicpath' }}
        run: |
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --show-error --silent --location --max-time 300 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/shorts/discover?brands=${SHORTS_BRAND_SLUGS}"
          echo

  snapshot:
    if: github.event.schedule == '37 3 * * *' || github.event.inputs.mode == 'snapshot'
    runs-on: ubuntu-latest
    steps:
      - name: Snapshot Shorts views
        env:
          APP_URL: ${{ vars.APP_URL || 'https://thread-uploader.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --show-error --silent --location --max-time 300 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/shorts/snapshot"
          echo
