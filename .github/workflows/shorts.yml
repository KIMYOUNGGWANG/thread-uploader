name: Shorts Radar

on:
  # 2026-11-08 수집 재개: 10/31에 껐더니 snapshot이 7일 지난 쇼츠를 지워(YouTube 캐싱 약관) 레이더가 비었다.
  # discover는 6시간마다. snapshot은 2026-11-09 동결 해제로 다시 매시간(velocityScore가 6시간 창을 쓰므로).
  schedule:
    - cron: '7 */6 * * *'
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 실행할 작업
        type: choice
        options: [discover, snapshot]
        default: snapshot

concurrency:
  group: shorts
  cancel-in-progress: false

jobs:
  discover:
    if: github.event.schedule == '7 */6 * * *' || github.event.inputs.mode == 'discover'
    runs-on: ubuntu-latest
    steps:
      - name: Discover rising Shorts
        env:
          APP_URL: ${{ vars.APP_URL || 'https://thread-uploader.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SHORTS_BRAND_SLUGS: ${{ vars.SHORTS_BRAND_SLUGS || 'cosmicpath' }}
        run: |
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --show-error --silent --location --max-time 300 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/shorts/discover?brands=${SHORTS_BRAND_SLUGS}"
          echo

  snapshot:
    if: github.event.schedule == '37 * * * *' || github.event.inputs.mode == 'snapshot'
    runs-on: ubuntu-latest
    steps:
      - name: Snapshot Shorts views
        env:
          APP_URL: ${{ vars.APP_URL || 'https://thread-uploader.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --show-error --silent --location --max-time 300 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/shorts/snapshot"
          echo
