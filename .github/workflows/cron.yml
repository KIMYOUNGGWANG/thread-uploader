name: Scheduled Post Publisher

on:
  schedule:
    # GitHub runs schedules hours late, so call hourly (off the busy :00 mark) and let
    # /api/cron/publish?slots= publish once per slot whenever a run lands in its window.
    - cron: '17 * * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

# Single scheduler: never let two publish runs overlap
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Publishing runs only through /api/cron/publish (safety gate, engine lock, resume).
      # One request per brand keeps each call under the route's maxDuration.
      - name: Publish via cron route
        env:
          APP_URL: ${{ vars.APP_URL || 'https://thread-uploader.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PUBLISH_BRAND_SLUGS: ${{ secrets.PUBLISH_BRAND_SLUGS || 'cosmicpath,cosmicpath-global' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          status=0
          for slug in ${PUBLISH_BRAND_SLUGS//,/ }; do
            # Slots are UTC hours. KR: KST 09/12/18/21/23. Global (new account, 2/day): US evening + US morning.
            case "$slug" in
              cosmicpath-global) slots="0,12" ;;
              *) slots="0,3,9,12,14" ;;
            esac
            # Manual dispatch publishes immediately; only scheduled runs are slot-gated.
            query="brands=${slug}"
            [ "$EVENT_NAME" = "schedule" ] && query="${query}&slots=${slots}"
            echo "::group::$slug"
            curl --fail-with-body --show-error --silent --location --max-time 300 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${APP_URL%/}/api/cron/publish?${query}" || status=1
            echo
            echo "::endgroup::"
          done
          exit $status

  # Reader-reply loop: publish due drafts (≤3 per brand per run), then scan the last week's posts for new
  # comments and draft (≤5 per run). Hourly keeps the "answered within 24h" promise even with GitHub's lag.
  # Re-enabled 2026-10-22 after the PR #20 fixes: /me failure skips the scan, no canned fallback is posted,
  # and a row is claimed (PUBLISHING) before the Threads call so an interrupted run cannot double-post.
  replies:
    runs-on: ubuntu-latest
    steps:
      - name: Reply to reader comments via cron route
        env:
          APP_URL: ${{ vars.APP_URL || 'https://thread-uploader.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --show-error --silent --location --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/replies"
