<!doctype html>
<!--
  CosmicPath 릴스 정지 템플릿 (6초, 1080x1920). layout 변수로 세 화면을 고른다:
    rank     — 일간 리스트 TOP 5          (item1..item5)
    vs       — 양자택일 두 칸              (leftLabel/leftItems, rightLabel/rightItems, 항목은 | 로 구분)
    calendar — 달마다 한 줄                (m1Label/m1Items/m1Note .. m3)
  원본 톤: video/src/components/RankCard.tsx + ReelsFrame.tsx. 등장 애니메이션 없이 첫 프레임부터 전부 보인다(짧은 반복 재생용).
  렌더: npx hyperframes render --batch specs/batch.json  (specs/README 참고)
-->
<html
  lang="ko"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"layout","type":"string","label":"레이아웃 (rank|vs|calendar)","default":"rank"},
    {"id":"title","type":"string","label":"제목","default":"2027년 운 좋은 일간 TOP 5"},
    {"id":"cta","type":"string","label":"CTA","default":"내 일간 보이면 두 번 터치"},
    {"id":"subCopy","type":"string","label":"하단 문구","default":"내 일간 모르면 → 프로필 링크, 1분이면 나와"},
    {"id":"item1","type":"string","label":"1위","default":"병화 — 귀인이 먼저 손 내미는 해"},
    {"id":"item2","type":"string","label":"2위","default":"임수 — 막혔던 재물 흐름이 풀림"},
    {"id":"item3","type":"string","label":"3위","default":"기토 — 이직·승진 타이밍이 옴"},
    {"id":"item4","type":"string","label":"4위","default":"신금 — 인연이 들어오는 해"},
    {"id":"item5","type":"string","label":"5위","default":"을목 — 쉬어가며 기반을 다지는 해"},
    {"id":"leftLabel","type":"string","label":"VS 왼쪽 제목","default":"들어오는 일간"},
    {"id":"leftItems","type":"string","label":"VS 왼쪽 항목 (| 구분)","default":"병화 — 제안은 바로 답|기토 — 받을 돈 먼저 확인|경금 — 미뤄둔 청구서"},
    {"id":"rightLabel","type":"string","label":"VS 오른쪽 제목","default":"모이는 일간"},
    {"id":"rightItems","type":"string","label":"VS 오른쪽 항목 (| 구분)","default":"을목 — 자동이체부터 정리|임수 — 큰 지출은 다음 달|신금 — 작게 꾸준히"},
    {"id":"m1Label","type":"string","label":"달 1","default":"11월"},
    {"id":"m1Items","type":"string","label":"달 1 일간 (| 구분)","default":"병화|기토"},
    {"id":"m1Note","type":"string","label":"달 1 한 줄","default":"계약·서류가 풀린다"},
    {"id":"m2Label","type":"string","label":"달 2","default":"12월"},
    {"id":"m2Items","type":"string","label":"달 2 일간 (| 구분)","default":"임수|을목"},
    {"id":"m2Note","type":"string","label":"달 2 한 줄","default":"사람이 먼저 연락한다"},
    {"id":"m3Label","type":"string","label":"달 3","default":"1월"},
    {"id":"m3Items","type":"string","label":"달 3 일간 (| 구분)","default":"신금|무토"},
    {"id":"m3Note","type":"string","label":"달 3 한 줄","default":"돈 이야기가 구체적이 된다"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Pretendard";
        src: url("assets/fonts/PretendardVariable.woff2") format("woff2");
        font-weight: 45 920;
      }
      /* ponytail: 명조는 이 Mac의 AppleMyungjo를 빌려 쓴다. CI(Linux)에서 같은 화면을 보장하려면 Noto Serif KR woff2를 assets/fonts에 넣고 url()로 바꾼다. */
      @font-face {
        font-family: "Myungjo";
        src: local("AppleMyungjo"), local("Noto Serif CJK KR"), local("NanumMyeongjo");
      }
      :root {
        --ink: #1d1a17;
        --seal: #a8322a;
        --font-sans: "Pretendard", sans-serif;
        --font-serif: "Myungjo", serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0d14; font-family: var(--font-sans); }
      #root { position: relative; width: 1080px; height: 1920px; }
      #bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      /* 위·아래를 어둡게 눌러 글자 대비 확보 */
      #shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,7,14,.55) 0%, rgba(5,7,14,.18) 45%, rgba(5,7,14,.35) 75%, rgba(5,7,14,.85) 100%); }

      /* 한지 패널: 카드 원본 비율(688:1024) 그대로 */
      #panel { position: absolute; top: 140px; left: 56px; width: 840px; height: 1250px; border-radius: 10px; box-shadow: 0 30px 70px rgba(0,0,0,.7); }
      #hanji { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; border-radius: 10px; }
      #content { position: relative; padding: 64px 54px 40px; }
      #title { font-family: var(--font-serif); font-size: 60px; color: var(--ink); line-height: 1.25; word-break: keep-all; margin-bottom: 26px; }
      #rule { height: 3px; background: var(--seal); margin-bottom: 10px; }

      /* 공통 조각: 천간 한자 박스 */
      .stem { flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-serif); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 8px; }
      .stem.lg { width: 104px; height: 104px; font-size: 72px; }
      .stem.md { width: 96px; height: 96px; font-size: 66px; }
      .name { font-weight: 700; color: var(--ink); line-height: 1.3; word-break: keep-all; }
      .note { font-weight: 500; color: rgba(29,26,23,.72); line-height: 1.35; word-break: keep-all; }

      /* rank */
      .row { display: flex; align-items: center; gap: 22px; padding: 24px 0; border-bottom: 1.5px solid rgba(168,50,42,.28); }
      .rank { width: 40px; flex-shrink: 0; font-family: var(--font-serif); font-size: 40px; color: var(--seal); text-align: center; }
      .row .name { font-size: 40px; }

      /* vs */
      #vs { position: relative; display: flex; gap: 0; margin-top: 14px; }
      .col { flex: 1; padding: 0 16px; }
      .col + .col { border-left: 1.5px solid rgba(168,50,42,.35); }
      .col-head { font-family: var(--font-serif); font-size: 42px; color: var(--seal); text-align: center; padding: 10px 0 18px; border-bottom: 1.5px solid rgba(168,50,42,.28); margin-bottom: 8px; word-break: keep-all; }
      .vs-item { display: flex; align-items: center; gap: 18px; padding: 50px 0; }
      .vs-item .name { font-size: 38px; }
      .vs-item .note { font-size: 28px; margin-top: 6px; }
      #vs-mark { position: absolute; left: 50%; top: 56%; transform: translate(-50%, -50%); width: 84px; height: 84px; border-radius: 42px; background: var(--seal); color: #f3eadb; font-family: var(--font-serif); font-size: 34px; display: flex; align-items: center; justify-content: center; letter-spacing: 1px; }

      /* calendar */
      .month { display: flex; align-items: center; gap: 24px; padding: 64px 0; border-bottom: 1.5px solid rgba(168,50,42,.28); }
      .month-label { width: 140px; flex-shrink: 0; font-family: var(--font-serif); font-size: 56px; color: var(--seal); }
      .month-body { display: flex; flex-direction: column; gap: 18px; }
      .month-stems { display: flex; gap: 14px; align-items: center; }
      .month-stems .name { font-size: 38px; margin-right: 14px; }
      .month .note { font-size: 34px; }

      /* 하단 */
      #footer { position: absolute; left: 70px; bottom: 330px; width: 840px; display: flex; flex-direction: column; gap: 14px; }
      #cta { font-size: 36px; font-weight: 700; color: #fde68a; line-height: 1.3; word-break: keep-all; }
      #subcopy { font-size: 32px; font-weight: 600; color: rgba(248,250,252,.82); line-height: 1.35; word-break: keep-all; }
      #brand { display: flex; align-items: center; gap: 14px; }
      #brand-dot { width: 18px; height: 18px; border-radius: 9px; background: linear-gradient(135deg, #fde68a, #a78bfa); box-shadow: 0 0 18px rgba(167,139,250,.8); }
      #brand-name { font-size: 30px; font-weight: 800; letter-spacing: 2px; color: #fde68a; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="reel" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <video id="bg" class="clip" data-start="0" data-duration="6" data-track-index="0" src="assets/reels/bg-cosmic.mp4" muted playsinline></video>
      <div id="shade"></div>

      <div id="panel" class="clip" data-start="0" data-duration="6" data-track-index="1" data-track-kind="graphics">
        <img id="hanji" src="assets/reels/cards/saju-front.png" alt="" />
        <div id="content">
          <div id="title" data-var-text="title"></div>
          <div id="rule"></div>

          <div id="rank">
            <div class="row" id="row1"><div class="rank">1</div><div class="stem lg"></div><div class="name"></div></div>
            <div class="row" id="row2"><div class="rank">2</div><div class="stem lg"></div><div class="name"></div></div>
            <div class="row" id="row3"><div class="rank">3</div><div class="stem lg"></div><div class="name"></div></div>
            <div class="row" id="row4"><div class="rank">4</div><div class="stem lg"></div><div class="name"></div></div>
            <div class="row" id="row5"><div class="rank">5</div><div class="stem lg"></div><div class="name"></div></div>
          </div>

          <div id="vs" hidden>
            <div class="col" id="col-left"><div class="col-head" data-var-text="leftLabel"></div></div>
            <div class="col" id="col-right"><div class="col-head" data-var-text="rightLabel"></div></div>
            <div id="vs-mark">VS</div>
          </div>

          <div id="calendar" hidden>
            <div class="month" id="month1"><div class="month-label" data-var-text="m1Label"></div><div class="month-body"><div class="month-stems"></div><div class="note" data-var-text="m1Note"></div></div></div>
            <div class="month" id="month2"><div class="month-label" data-var-text="m2Label"></div><div class="month-body"><div class="month-stems"></div><div class="note" data-var-text="m2Note"></div></div></div>
            <div class="month" id="month3"><div class="month-label" data-var-text="m3Label"></div><div class="month-body"><div class="month-stems"></div><div class="note" data-var-text="m3Note"></div></div></div>
          </div>
        </div>
      </div>

      <div id="footer" class="clip" data-start="0" data-duration="6" data-track-index="2" data-track-kind="graphics">
        <div id="cta" data-var-text="cta"></div>
        <div id="subcopy" data-var-text="subCopy"></div>
        <div id="brand"><div id="brand-dot"></div><div id="brand-name">CosmicPath</div></div>
      </div>

      <audio id="bgm" data-start="0" data-duration="6" data-track-index="3" data-volume="0.126" data-fade-out="0.4" src="assets/reels/bgm-ambient.m4a"></audio>
    </div>

    <script>
      // 한지 위에서 읽히도록 어둡게 맞춘 오행 색: 목 청록, 화 적, 토 황, 금 회백, 수 흑
      const STEMS = {
        갑: ["甲", "#2f6f5a"], 을: ["乙", "#2f6f5a"],
        병: ["丙", "#b8322a"], 정: ["丁", "#b8322a"],
        무: ["戊", "#a77a18"], 기: ["己", "#a77a18"],
        경: ["庚", "#7d7a74"], 신: ["辛", "#7d7a74"],
        임: ["壬", "#1d1a17"], 계: ["癸", "#1d1a17"],
      };
      const vars = window.__hyperframes.getVariables();
      const str = (k) => String(vars[k] ?? "").trim();
      const split = (k) => str(k).split("|").map((s) => s.trim()).filter(Boolean);
      // "병화 — 문구" → { hanja, color, name, note }
      const parse = (text, fallback) => {
        const [name, ...rest] = text.split("—").map((s) => s.trim());
        const [hanja, color] = STEMS[name.charAt(0)] ?? [fallback, "#1d1a17"];
        return { hanja, color, name, note: rest.join(" — ") };
      };
      const stemBox = (parent, size, item) => {
        const box = parent.querySelector(".stem") ?? parent.appendChild(Object.assign(document.createElement("div"), { className: `stem ${size}` }));
        box.textContent = item.hanja; box.style.color = item.color; box.style.borderColor = item.color;
      };
      const layout = str("layout") || "rank";
      for (const id of ["rank", "vs", "calendar"]) document.getElementById(id).hidden = id !== layout;

      if (layout === "rank") {
        for (let i = 1; i <= 5; i++) {
          const row = document.getElementById("row" + i);
          const item = parse(str("item" + i), String(i));
          stemBox(row, "lg", item);
          row.querySelector(".name").textContent = item.note ? `${item.name} — ${item.note}` : item.name;
        }
      } else if (layout === "vs") {
        for (const [col, key] of [["col-left", "leftItems"], ["col-right", "rightItems"]]) {
          const parent = document.getElementById(col);
          for (const text of split(key)) {
            const item = parse(text, "·");
            const el = parent.appendChild(document.createElement("div")); el.className = "vs-item";
            stemBox(el, "md", item);
            const body = el.appendChild(document.createElement("div"));
            body.appendChild(Object.assign(document.createElement("div"), { className: "name", textContent: item.name }));
            if (item.note) body.appendChild(Object.assign(document.createElement("div"), { className: "note", textContent: item.note }));
          }
        }
      } else {
        for (let i = 1; i <= 3; i++) {
          const stems = document.getElementById("month" + i).querySelector(".month-stems");
          for (const text of split(`m${i}Items`)) {
            const item = parse(text, "·");
            const wrap = stems.appendChild(document.createElement("div")); wrap.style.display = "flex"; wrap.style.alignItems = "center"; wrap.style.gap = "12px";
            stemBox(wrap, "lg", item);
            wrap.appendChild(Object.assign(document.createElement("div"), { className: "name", textContent: item.name }));
          }
        }
      }

      // 정지 화면: 트윈 없이 빈 타임라인만 등록한다
      const tl = gsap.timeline({ paused: true });
      window.__timelines["reel"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
